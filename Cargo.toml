[package]
name = "trein_video"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# HTTP
axum = "0.7"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = { version = "1.3", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# TLS/mTLS
# NOTE: `axum-server` 0.6 (latest on crates.io) fails to compile against the
# hyper-util version pulled in transitively by axum 0.7 (E0277: `BodyData:
# Buf` not satisfied in its HTTP/2-upgrade accept loop) — a known
# axum-server/hyper-util version-skew issue with no fixed release yet. We
# terminate TLS ourselves instead: a manual `TcpListener` accept loop +
# `tokio_rustls::TlsAcceptor` + `hyper::server::conn::http1`, which is the
# same low-level recipe axum's own examples used before `axum-server`
# existed and avoids the broken code path entirely.
rustls = { version = "0.23", features = ["std", "ring"] }
rustls-pemfile = "2.1"
# Must stay on a tokio-rustls release built against rustls 0.23 (0.25.x pulls
# rustls 0.22, which is ABI-incompatible with our direct rustls 0.23 dep and
# fails to compile with "expected tokio_rustls::rustls::ServerConfig, found
# rustls::ServerConfig").
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", features = ["pem"] }
time = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# FFmpeg / SMB
# Deliberately no native binding crates here: `src/video/converter.rs` and
# `src/video/analyzer.rs` shell out to the `ffmpeg`/`ffprobe` binaries, and
# `src/nas/smb_client.rs` shells out to `smbclient`, all via
# `tokio::process::Command`. Requires ffmpeg + samba-client installed on the
# host (see README); checked for at startup in `main.rs`.

# mDNS/Zeroconf
mdns-sd = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.6"
futures = "0.3"

# Progress display (#20): live progress bars during download/analyze/convert/
# upload, with a plain-text fallback when stdout isn't a TTY (e.g. redirected
# to a log file).
indicatif = "0.17"
is-terminal = "0.4"

# Config path resolution (#30): cross-platform XDG-style base directory
# resolution for the default `--config` path
# (`~/.config/trein-video/config.toml` on macOS/Linux,
# `%APPDATA%/trein-video/config.toml` on Windows) when `--config` is omitted.
directories = "6.0.0"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
# Adds `test-util` (paused/virtual time, `#[tokio::test(start_paused = true)]`)
# on top of the `full` feature set already pulled in by the main `tokio`
# dependency, so backoff/retry tests (#15/#17) don't have to actually sleep
# through real wall-clock delays. Cargo unions feature sets across
# [dependencies]/[dev-dependencies] entries for the same crate, and this
# extra feature only applies to test/dev builds, not the release binary.
tokio = { version = "1.40", features = ["test-util"] }

[lib]
name = "trein_video"
path = "src/lib.rs"

[[bin]]
name = "trein-video"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
